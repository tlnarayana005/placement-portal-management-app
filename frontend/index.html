<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusRecruit — IIT Madras Placement Portal</title>
    <meta name="description" content="Official placement portal for IIT Madras students and recruiting partners.">
    
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- Vue 3 & Router -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <style>
        :root {
            --crh-primary: #4f46e5;
            --crh-primary-hover: #4338ca;
            --crh-secondary: #64748b;
            --crh-success: #10b981;
            --crh-warning: #f59e0b;
            --crh-danger: #ef4444;
            --crh-bg: #f8fafc;
            --crh-card-bg: #ffffff;
            --crh-text-main: #0f172a;
            --crh-text-muted: #64748b;
            --crh-border: #e2e8f0;
            --crh-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --crh-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --crh-shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        * {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--crh-bg);
            color: var(--crh-text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ─── Modern Navbar ─── */
        .navbar-crh {
            background-color: var(--crh-card-bg);
            border-bottom: 1px solid var(--crh-border);
            padding: 0.75rem 0;
            transition: all 0.3s ease;
        }
        .navbar-crh .navbar-brand {
            font-weight: 800;
            color: var(--crh-primary);
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .navbar-crh .nav-link {
            font-weight: 500;
            color: var(--crh-secondary);
            font-size: 0.925rem;
            padding: 0.5rem 1rem !important;
            transition: color 0.2s;
        }
        .navbar-crh .nav-link:hover {
            color: var(--crh-primary);
        }
        .navbar-crh .btn-signin {
            background-color: var(--crh-primary);
            color: white;
            font-weight: 600;
            border-radius: 8px;
            padding: 0.5rem 1.25rem;
            transition: all 0.2s;
        }
        .navbar-crh .btn-signin:hover {
            background-color: var(--crh-primary-hover);
            transform: translateY(-1px);
        }

        /* ─── Professional Cards ─── */
        .card-crh {
            background-color: var(--crh-card-bg);
            border: 1px solid var(--crh-border);
            border-radius: 12px;
            box-shadow: var(--crh-shadow-sm);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .card-crh:hover {
            box-shadow: var(--crh-shadow);
        }

        /* ─── Hero Section ─── */
        .hero-section {
            padding: 4rem 0;
            background: radial-gradient(circle at top right, rgba(79, 70, 229, 0.05), transparent),
                        radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.05), transparent);
        }

        /* ─── Professional Buttons ─── */
        .btn-primary-crh {
            background-color: var(--crh-primary);
            border: none;
            font-weight: 600;
            padding: 0.625rem 1.5rem;
            border-radius: 8px;
            box-shadow: var(--crh-shadow-sm);
            transition: all 0.2s;
        }
        .btn-primary-crh:hover {
            background-color: var(--crh-primary-hover);
            transform: translateY(-1px);
            box-shadow: var(--crh-shadow);
        }
        .btn-outline-crh {
            background: white;
            border: 1px solid var(--crh-border);
            color: var(--crh-text-main);
            font-weight: 600;
            padding: 0.625rem 1.5rem;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-outline-crh:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* ─── Skeleton Loading ─── */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ─── Animations ─── */
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── Toasts ─── */
        .crh-toast {
            border-radius: 12px;
            border: none;
            background-color: var(--crh-text-main);
            color: white;
            box-shadow: var(--crh-shadow-lg);
        }

        /* ─── Generic Layout ─── */
        footer {
            border-top: 1px solid var(--crh-border);
            background-color: var(--crh-card-bg);
            color: var(--crh-text-muted);
            font-size: 0.875rem;
        }

        /* Tables & Lists */
        .table-crh thead th {
            background-color: #f8fafc;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--crh-text-muted);
            border-bottom: 2px solid var(--crh-border);
        }
    </style>
</head>
<body>
    <div id="app" class="d-flex flex-column min-vh-100">
        <!-- Site Header / Navbar -->
        <header class="navbar-crh sticky-top">
            <div class="container d-flex justify-content-between align-items-center">
                <router-link to="/" class="navbar-brand">
                    <i class="bi bi-rocket-takeoff-fill"></i> CampusRecruit
                </router-link>
                
                <nav class="d-flex align-items-center gap-2">
                    <!-- Guest Navigation -->
                    <template v-if="!isLoggedIn">
                        <router-link to="/login" class="nav-link">Sign In</router-link>
                        <router-link to="/register" class="btn btn-signin">Get Started</router-link>
                    </template>
                    
                    <!-- Authenticated Navigation -->
                    <template v-else>
                        <span class="text-muted small me-2 d-none d-sm-inline">
                            Welcome, <span class="fw-600 text-dark">{{ userName }}</span>
                        </span>
                        <button @click="logout" class="btn btn-outline-crh btn-sm">
                            <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                        </button>
                    </template>
                </nav>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow-1">
            <div class="container py-4 fade-in">
                <router-view></router-view>
            </div>
        </main>

        <!-- Notifications Layer -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">
            <div id="crhToast" class="toast crh-toast" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex p-2">
                    <div class="toast-body flex-grow-1">
                        {{ toastMessage }}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        </div>

        <!-- Global Footer -->
        <footer class="py-4 mt-5">
            <div class="container text-center">
                <p class="mb-0">© 2026 CampusRecruit &bull; IIT Madras Placement Cell</p>
                <div class="mt-2 d-flex justify-content-center gap-3">
                    <a href="#" class="text-decoration-none text-muted small">Privacy Policy</a>
                    <a href="#" class="text-decoration-none text-muted small">Terms of Service</a>
                    <a href="#" class="text-decoration-none text-muted small">Contact Admissions</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Scripts Bootstrap 5.3 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main Application Entry -->
    <script type="module" src="/src/app.js"></script>
</body>
</html>
